name: Build and Deploy

on:
  push:
    tags:
      - 'v*.*.*' # 当推送版本标签时触发（如 v1.2.3）

env:
  REGISTRY: crpi-ow7mi2apt624v3c8.cn-heyuan.personal.cr.aliyuncs.com
  NAMESPACE: xiye-docker
  IMAGE_NAME: my-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        run: |
          docker login --username ${{ secrets.ALICLOUD_USERNAME }} --password ${{ secrets.ALICLOUD_PASSWORD }} ${{ env.REGISTRY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{  22 }}
          script: |
            REGISTRY="${{ env.REGISTRY }}"
            NAMESPACE="${{ env.NAMESPACE }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="form-editor"
            FULL_IMAGE_NAME="$REGISTRY/$NAMESPACE/$IMAGE_NAME:latest"

            echo "=========================================="
            echo "开始部署 form-editor 应用"
            echo "镜像: $FULL_IMAGE_NAME"
            echo "=========================================="

            # 检查Docker是否运行
            if ! docker info > /dev/null 2>&1; then
              echo "❌ 错误: Docker 未运行或无权限访问"
              exit 1
            fi

            # 登录阿里云容器镜像服务
            echo "📦 登录阿里云容器镜像服务..."
            echo "${{ secrets.ALICLOUD_PASSWORD }}" | docker login --username="${{ secrets.ALICLOUD_USERNAME }}" --password-stdin $REGISTRY || {
              echo "❌ 登录失败，请检查凭证"
              exit 1
            }

            # 停止并删除旧容器
            echo "🛑 停止旧容器..."
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

            # 拉取最新镜像
            echo "⬇️  拉取最新镜像: $FULL_IMAGE_NAME"
            docker pull $FULL_IMAGE_NAME || {
              echo "❌ 镜像拉取失败"
              exit 1
            }

            # 启动新容器
            echo "🚀 启动新容器..."
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 8081:80 \
              --label "app=form-editor" \
              --label "version=latest" \
              --label "updated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              $FULL_IMAGE_NAME || {
              echo "❌ 容器启动失败"
              docker logs $CONTAINER_NAME 2>/dev/null || true
              exit 1
            }

            # 等待容器启动
            echo "⏳ 等待容器启动..."
            sleep 10

            # 检查容器状态
            if docker ps | grep -q $CONTAINER_NAME; then
              echo "✅ 容器运行正常"
              docker ps --filter name=$CONTAINER_NAME --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

              # 健康检查
              echo "🏥 执行健康检查..."
              if curl -f http://localhost:8081/health > /dev/null 2>&1; then
                echo "✅ 健康检查通过"
              else
                echo "⚠️  健康检查失败，请检查应用日志"
                docker logs $CONTAINER_NAME --tail 50
              fi
            else
              echo "❌ 容器启动失败！"
              docker logs $CONTAINER_NAME 2>/dev/null || true
              exit 1
            fi

            # 清理悬空镜像
            echo "🧹 清理悬空镜像..."
            docker image prune -f

            echo ""
            echo "=========================================="
            echo "🎉 部署完成！"
            echo "镜像: $FULL_IMAGE_NAME"
            echo "访问地址: http://form-editor.xiyeeee.cn"
            echo "=========================================="
